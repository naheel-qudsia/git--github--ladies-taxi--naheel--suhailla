<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinkRide - Ladies Taxi</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3 sticky-top">
  <div class="container">
    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold pink-text" href="#">
      <img src="Images/WhatsApp Image 2026-10-25 at 8.10.58 PM.jpeg" alt="PinkRide" width="32">
      PinkRide
    </a>

    <!-- Toggler for mobile -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#pinkNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links -->
    <div class="collapse navbar-collapse" id="pinkNavbar">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3">
        <li class="nav-item">
          <a class="nav-link active pink-active" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Contact</a>
        </li>
      </ul>

      <!-- Button -->
      <a href="#" class="btn book-btn d-flex align-items-center gap-2">
        <img src="Images/car.png" alt="car" width="16">
        Book a Ride
      </a>
    </div>
  </div>
</nav>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- HERO SECTION -->
<section class="hero-section py-5">
  <div class="container">
    <div class="row align-items-center">
           

        <h1 class="hero-title">
          Your safe Ride,<br>
          Elegance,<br>
          <span>Our Priority</span>
        </h1>

        <p class="hero-desc mt-3">
          Our ladies-only taxi service offers a unique blend of comfort, safety,<br>
          and elegance, ensuring every ride is a delightful experience.
        </p>

        <div class="hero-buttons mt-4 d-flex gap-3 justify-content-center justify-content-lg-start">
          <a href="#" class="btn btn-pink">
            <img src="Images/car.png" alt="car" width="16"> Book A Ride
          </a>
        </div>

        <!-- Small stats below buttons (optional like design) -->
        

      <!-- Right Image -->
      <div class="col-lg-6 text-center position-relative">
        <div class="hero-image-wrapper mx-auto">
          <img src="Images/PinkRide Ladies Taxi Side Profile.png" alt="bow" class="bow-decoration">
        </div>
      </div>

    </div>
  </div>
</section>

</body>
</html>
